name: bgnu_mentor
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  provider: ^6.1.2
  google_fonts: 6.3.0
  intl: ^0.19.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  font_awesome_flutter: 10.7.0
  file_picker: ^8.1.2
  flutter_staggered_animations: ^1.0.0
  http: ^1.1.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  video_player: ^2.9.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.jpg"
    background_color: "#ffffff"
    theme_color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
